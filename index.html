<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuỗi từ nối</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:600px;margin:20px auto;padding:0 16px;text-align:center;line-height:1.7;background:#fafafa;color:#222}
  h1{font-size:20px}
  button{padding:6px 14px;margin-bottom:12px;cursor:pointer}
  #bar{position:sticky;top:0;background:inherit;padding:8px 0;margin-bottom:8px;border-bottom:1px solid #ccc;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;z-index:1}
  #bar{background:#fafafa}
  @media(prefers-color-scheme:dark){#bar{background:#181818;border-color:#333}}
  ol{padding:0;list-style:none;margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
  li{display:flex;align-items:center;gap:12px;width:100%;max-width:280px;padding:5px 10px;background:#fff;border:1px solid #d5d9e0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:17px;font-weight:600;text-align:left}
  li b{flex:none;min-width:40px;padding:1px 6px;background:#eef1f6;color:#667;border-radius:8px;font-size:12px;font-weight:600;text-align:center}
  li span{flex:1;text-align:center;letter-spacing:.3px}
  @media(prefers-color-scheme:dark){li{background:#222;border-color:#444}li b{background:#333;color:#aaa}}
  @media(prefers-color-scheme:dark){body{background:#181818;color:#eee}li{border-color:#333}}
</style>
</head>
<body>
<h1>Chuỗi nối từ (<span id="count"></span> từ)</h1>
<div id="bar">
  <button id="toggle">▶ Cuộn tự động</button>
  <label>Tốc độ <input type="range" id="speed" min="10" max="400" value="60"> <span id="sv">60</span></label>
</div>
<ol id="list"></ol>

<script>
const RAW = `
học
hành quân nhân công nhân hậu phương pháp nhân văn
bản đồ ăn nói bóng đèn cầy hương hoa hậu trường
sinh hạ bộ máy móc câu thơ ca khúc ca
dao động cơ quan âm đạo lý giải độc thân
nhân sinh thành công khai thông công danh nhân tài
chính quốc nội công lập phương thuốc lá bài học
sinh tử cung cầu toàn cầu cứu tinh thông số
lượng tử hình thành văn học trò chơi bời bời lời
nói ra đi ra vào ra mắt kính phục sinh
trưởng thành viên chức danh tài hoa quả báo động
kinh hoàng thượng sách phong hoá trị bệnh án lệ phí
phạm tội phạm pháp danh từ đầu quân tử thần tượng hình
thể thao túng thiếu sót lại nữa rồi nữa là
lạ đời sống còn lại bộ mặt mũi khoan dung
tha tội lỗi lầm lỗi hẹn hò hẹn thề ước
lượng thứ trưởng đoàn trưởng phòng họp hành doanh nhân
từ bỏ đi biệt danh tính nết na ná ná
thở dài dài dòng máu lạnh người lạ thường dân
quân hàm số phận sự cố nhân tình hình hài
hoà đồng thanh âm thanh minh thệ sư phụ bạc
tình đầu tiên nghiệm thu liễm dung nạp thái ất
giáp trụ cột điện thoại đàm thoại bản địa hình
thù vặt lông lá chét tay chân chính thất lạc
đường dây dẫn đường đi làm ăn năn nỉ nài
nỉ non nước hoa văn hoá giải pháp trường thọ
tiễn đưa tiễn biệt động lòng mề đay nghiến ngấu
nghiến răng nanh vuốt ve sầu riêng tư nhân quả tạ
lỗi thời lượng giác ngộ đạo sư phạm vi khuẩn lao phổi phèo phổi
heo heo nái heo hút máu mặt nạ dòng chảy
máu lửa hận thù hận đời kiếp đời sau đó
đây đẩy đưa đẩy mạnh mẽ ngoài đường cùng đường bộ
trưởng thôn xóm làng chài bài toán lý thuyết lý
sự lý luận điểm danh sách vở kịch bản nhạc
điệu hò reo hò khoan thủng thỉnh kinh động tác
dụng cụ bà lão luyện tập trung lập công giáo
hội chứng cứ điểm xạ thủ thuật toán học lệch
pha trộn lẫn lộn ngược xuôi ngược dòng điện lưới
rê bóng chuyền tay lái xe máy bay nhảy cóc
tía tô vẽ tranh biện pháp y thuật ngữ vựng
tập hợp đồng hương sen tắm táp nhau thai nghén
ăn ý nghĩ thầm lặng lặng lẽ phải lứa đôi
mươi hai lòng dạ dịp vui vẻ vang vọng niệm
phật sống động từ ngữ văn hiến chương chướng mắt
mũi tẹt mũi tên lửa trại hè thu gom góp
mặt phẳng lặng câm lặng im lặng người tình trạng
thái hậu thế phiệt duyệt bài làm chủ quan thoại
kịch liệt sĩ quan tài khoản vay mượn cớ sự
vật thể chất độc ác nhân bản thân thương cảm
tình cảm tử nạn dân sự tích đức hạnh phúc
hậu bối cảnh quan chức năng động thổ cư ngụ
tình báo thù ghét bỏ qua mặt mẹt cơm
`;

const syl = RAW.trim().split(/\s+/);
const words = [];
for (let i = 0; i < syl.length - 1; i++) words.push(syl[i] + " " + syl[i + 1]);


document.getElementById("count").textContent = words.length;
document.getElementById("list").innerHTML =
  words.map((w, i) => `<li><b>${i + 1}</b><span>${w}</span></li>`).join("");


let running=false,last=0,pos=0;
const btn=document.getElementById("toggle"),sp=document.getElementById("speed"),sv=document.getElementById("sv");
sp.oninput=()=>sv.textContent=sp.value;
function tick(t){
  if(!running)return;
  if(last){
    pos+=sp.value*(t-last)/1000;
    const step=Math.floor(pos);
    if(step>=1){window.scrollBy(0,step);pos-=step;}
  }
  last=t;
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2){stop();return;}
  requestAnimationFrame(tick);
}
function start(){running=true;last=0;pos=0;btn.textContent="⏸ Dừng";requestAnimationFrame(tick);}
function stop(){running=false;btn.textContent="▶ Cuộn tự động";}
btn.onclick=()=>running?stop():start();
</script>
</body>
</html>
